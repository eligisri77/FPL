# FPL manager profile — source of truth for the agent
# Edit this file when preferences change.

manager:
  goal: overall_rank          # high OR
  style: aggressive           # hits OK when edge is clear
  weekly_time_minutes: 60
  planning_horizon_gws: 2     # temporary: maximize GW1–2, then Wildcard
  language: he                # reply to user in Hebrew only — no English/Hebrew mix
  deadline_gw1: "2026-08-21"  # ~3 weeks — expect many draft changes before lock

budget:
  total: 100.0
  target_itb: 0.2             # keep ~£0.2m in the bank

squad_philosophy:
  strong_xi: true
  bench: strong_for_horizon   # usable bench for GW1–2 (not 4.0 fodder)
  open_to_stronger_bench: true
  note: >
    Build 15 that can all contribute in GW1–2. Wildcard in GW3 to rebuild
    for the season with more info (minutes, injuries, early form).

constraints:
  banned_players:
    - Salah                   # Mohamed Salah — never pick
  max_per_club: 3
  # Allowed: 3 from same club if different positions
  # Forbidden: 2+ from same club in the same position
  same_club_same_position: false

locked_players: []
avoid_players: []
prefer_players:
  - Haaland
  - B.Fernandes
  - Gabriel
  - Semenyo
  - Guéhi
  - Rogers

minutes_policy:
  min_nailed_in_xi: 9
  treat_as_nailed:
    - Semenyo
  avoid_in_xi_unless_necessary:
    - bench_fodder
    - sub_5_starts

chips:
  wildcard_gw: 3              # plan: WC after GW1–2
  wildcard_early_window: [3, 3]
  free_hit: blanks_only
  triple_captain: doubles_or_elite_fixture
  bench_boost: consider_gw2_if_bench_plays  # optional if 15 look good
  aggressive_hits: true
  hit_rule: >
    In GW1–2 avoid hits unless injury. Rebuild freely on WC GW3.

captaincy:
  default: best_fixture_among_premiums
  differential_captain: rare_extreme_fixture_only

team_id: 737774              # Eli's Team — league "אחד שיודע" (4244)
league_ids:
  - 4244
current_squad_file: squads/live.json
