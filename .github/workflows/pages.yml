name: Publish GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare static site
        run: |
          mkdir _site
          cp index.html _site/
          cp -r viewer _site/
          rm -f _site/viewer/*.py
          touch _site/.nojekyll
          # Bust CDN/browser caches after every deploy
          echo "deployed=$(date -u +%Y%m%d%H%M%S)" > _site/version.txt

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4

      # Keep gh-pages branch in sync (old Pages source / bookmarks)
      - name: Sync gh-pages branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages || true
          work=/tmp/gh-pages-sync
          rm -rf "$work"
          mkdir -p "$work"
          cp -a _site/. "$work/"
          cd "$work"
          git init
          git checkout -b gh-pages
          git add -A
          git commit -m "Sync Pages from main ${{ github.sha }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages:gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}